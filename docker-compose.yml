version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: timetask-db
    environment:
      POSTGRES_DB: tasktime
      POSTGRES_USER: tasktime
      POSTGRES_PASSWORD: tasktime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktime -d tasktime"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: timetask-server
    environment:
      # Use NEON_DATABASE_URL for consistency, but point to local postgres for development
      NEON_DATABASE_URL: "postgres://tasktime:tasktime@postgres:5432/tasktime?sslmode=disable"
      JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production-min-32-chars"
      TASKTIME_PORT: "8080"
      TASKTIME_HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      JWT_EXPIRY_DAYS: "7"
      WS_PING_INTERVAL: "30s"
      WS_PONG_TIMEOUT: "60s"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: